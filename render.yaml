services:
  - type: web
    name: cap-store
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/products
    autoDeploy: true
    envVars:
      - key: PUBLIC_DEMO
        value: "true"
